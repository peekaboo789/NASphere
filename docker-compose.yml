# ============================================================
# NASphere - Docker Compose
# ============================================================
#
# 项目名称：NASphere
# 作者：peekaboo789
# GitHub：https://github.com/peekaboo789/NASphere
#
# 这一版不内嵌 Dockerfile：镜像先备好，compose 只负责起容器。
# 取镜像三选一：
#
#   1. docker build -t local/nasphere:1.0.0 .
#   2. docker load -i nasphere-1.0.0-linux-<arch>.tar.gz（离线镜像包，名字就是它）
#   3. ./deploy.sh（脚本 build 出同名镜像；它自己会用 docker run 起容器，
#      再执行 docker compose up 会撞容器名，先 docker rm -f nasphere）
#
# 启动：
#
#   docker compose up -d
#
# 默认访问：
#
#   http://NAS-IP:18086
#
# ============================================================

services:

  # ----------------------------------------------------------
  # NASphere 主服务
  # ----------------------------------------------------------
  nasphere:

    # ========================================================
    # 镜像
    # ========================================================
    #
    # 这里是写死的值，升级版本号时和 package.json 一起改。
    #
    image: local/nasphere:1.0.0

    # ========================================================
    # 容器名称
    # ========================================================
    container_name: nasphere

    # ========================================================
    # 自动重启
    # ========================================================
    #
    # NAS / Docker 重启后自动启动 NASphere。
    #
    restart: unless-stopped

    # ========================================================
    # Web 访问端口
    # ========================================================
    #
    # 格式：宿主机端口:容器端口
    #
    # 容器内部固定监听 18086（镜像里 ENV PORT=18086），
    # 冒号右边那一位不要跟着改。
    #
    ports:
      - "18086:18086"

    # ========================================================
    # 数据卷
    # ========================================================
    volumes:

      # ------------------------------------------------------
      # NASphere 数据持久化
      #
      # 配置、账号、壁纸、图标都在这里，
      # 删除容器不会删除这里的数据。
      #
      # 宿主机 ./data 对应容器内 /app/data（镜像里 ENV DATA_DIR）。
      # ------------------------------------------------------
      - ./data:/app/data

      # ------------------------------------------------------
      # Docker Socket
      #
      # 容器组件用它读取 Docker 项目和容器信息，并做启停 / 重启。
      #
      # ⚠️ 属于高权限接口，不建议把 NASphere 直接暴露到公网。
      # ------------------------------------------------------
      - /var/run/docker.sock:/var/run/docker.sock

# ============================================================
# 常用命令
# ============================================================
#
# 查看状态：
#
#   docker ps -a --filter name=nasphere
#
# 查看日志：
#
#   docker logs -f nasphere
#
# 停止：
#
#   docker compose down
#
# 更新 NASphere：先弄到新版本的镜像（docker build 或离线包 docker load），
# 把上面 image 的标签一起改掉，再 docker compose up -d。
# 走 ./deploy.sh --update 的话脚本会自己 build 并 docker run 起容器，不用 compose。
#
