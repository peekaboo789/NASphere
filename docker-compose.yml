# ============================================================
# NASphere - Docker Compose 单文件部署
# ============================================================
#
# 项目名称：NASphere
# 作者：peekaboo789
# GitHub：https://github.com/peekaboo789/NASphere
#
# 本方案特点：
#   1. 用户只需要本 docker-compose.yml
#   2. 不需要提前下载 NASphere 源码
#   3. 不需要 Git Clone
#   4. 不需要下载 .tar.gz / Release 压缩包
#   5. 构建时自动通过 gh-proxy.com 获取 GitHub 最新源码
#   6. Node.js 基础镜像使用 DaoCloud 镜像加速
#   7. 自动构建 NASphere Docker 镜像
#   8. 自动启动 NASphere 容器
#   9. 配置和数据持久化到当前目录 ./data
#  10. 通过 Docker Socket 获取 Docker 项目和容器信息
#
# 快速开始：
#
#   docker compose up -d --build
#
# 默认访问：
#
#   http://NAS-IP:18086
#
# ============================================================

services:

  # ----------------------------------------------------------
  # NASphere 主服务
  # ----------------------------------------------------------
  nasphere:

    # ========================================================
    # Docker 镜像构建
    # ========================================================
    build:

      # 构建上下文。
      #
      # 因为 NASphere 源码不放在用户本地，
      # 所以这里只需要一个空目录即可。
      #
      # 真正的 NASphere 源码会在下面的 Dockerfile 中
      # 自动从 GitHub 获取。
      context: .

      # ------------------------------------------------------
      # 内嵌 Dockerfile
      #
      # 不需要额外创建 Dockerfile。
      # 整个部署只需要这一个 YAML 文件。
      # ------------------------------------------------------
      dockerfile_inline: |

        # ----------------------------------------------------
        # Node.js 22 + Alpine
        #
        # 使用 DaoCloud 镜像加速，减少 Docker Hub 访问问题。
        # ----------------------------------------------------
        FROM m.daocloud.io/docker.io/library/node:22-alpine


        # ----------------------------------------------------
        # 安装 Git
        #
        # Git 用于在构建过程中下载 NASphere 源码。
        # ----------------------------------------------------
        RUN apk add --no-cache git


        # ----------------------------------------------------
        # 设置应用工作目录
        # ----------------------------------------------------
        WORKDIR /app


        # ----------------------------------------------------
        # 从 GitHub 获取 NASphere 最新源码
        #
        # GitHub：
        # https://github.com/peekaboo789/NASphere
        #
        # 国内环境通过 gh-proxy.com 加速。
        #
        # --depth 1：
        # 只获取最新版本，减少下载量和构建时间。
        # ----------------------------------------------------
        RUN git clone --depth 1 \
            https://gh-proxy.com/https://github.com/peekaboo789/NASphere.git \
            /tmp/nasphere \
            \
            # ------------------------------------------------
            # 复制服务端代码
            # ------------------------------------------------
            && cp -a /tmp/nasphere/server /app/server \
            \
            # ------------------------------------------------
            # 复制前端页面
            # ------------------------------------------------
            && cp -a /tmp/nasphere/public /app/public \
            \
            # ------------------------------------------------
            # 复制 Node.js 项目配置
            # ------------------------------------------------
            && cp /tmp/nasphere/package.json /app/package.json \
            \
            # ------------------------------------------------
            # 删除临时 Git 仓库
            #
            # 最终镜像不保留 Git 历史和 .git 目录。
            # ------------------------------------------------
            && rm -rf /tmp/nasphere


        # ----------------------------------------------------
        # Node.js 运行环境
        # ----------------------------------------------------
        ENV NODE_ENV=production


        # ----------------------------------------------------
        # NASphere 服务端口
        #
        # 容器内部固定使用 8080。
        # 外部端口在下面 ports 中修改。
        # ----------------------------------------------------
        ENV PORT=8080


        # ----------------------------------------------------
        # NASphere 数据目录
        #
        # 容器内部：
        # /data
        #
        # 对应宿主机：
        # ./data
        # ----------------------------------------------------
        ENV DATA_DIR=/data


        # ----------------------------------------------------
        # 创建数据目录并安装 Node.js 依赖
        #
        # --omit=dev：
        # 只安装生产环境需要的依赖。
        # ----------------------------------------------------
        RUN mkdir -p /data \
            && chmod 700 /data \
            && npm install --omit=dev


        # ----------------------------------------------------
        # 声明容器内部端口
        # ----------------------------------------------------
        EXPOSE 8080


        # ----------------------------------------------------
        # Docker Health Check
        #
        # Docker 会定期访问：
        #
        # /api/health
        #
        # 用于判断 NASphere 是否正常运行。
        # ----------------------------------------------------
        HEALTHCHECK \
          --interval=30s \
          --timeout=5s \
          --start-period=15s \
          --retries=3 \
          CMD node -e "require('http').get('http://127.0.0.1:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"


        # ----------------------------------------------------
        # 启动 NASphere
        # ----------------------------------------------------
        CMD ["node", "server/index.js"]


    # ========================================================
    # 容器名称
    # ========================================================
    #
    # 固定名称方便：
    #
    # docker logs nasphere
    # docker exec -it nasphere sh
    #
    container_name: nasphere


    # ========================================================
    # 自动重启
    # ========================================================
    #
    # NAS / Docker 重启后自动启动 NASphere。
    #
    restart: unless-stopped


    # ========================================================
    # 使用 tini 初始化进程
    #
    # 可以更好地处理 Node.js 子进程和系统信号。
    # ========================================================
    init: true


    # ========================================================
    # Docker Socket 权限
    # ========================================================
    #
    # NASphere 需要读取宿主机 Docker 项目和容器信息。
    #
    # 你的 NAS 当前：
    #
    # /var/run/docker.sock
    #
    # 所属 GID 为：
    #
    # 994
    #
    # 因此将容器加入 GID 994。
    #
    # 如果部署到其他 NAS：
    #
    # 先执行：
    #
    #   ls -ln /var/run/docker.sock
    #
    # 如果显示的 GID 不是 994，
    # 请将下面的 994 修改为实际 GID。
    #
    group_add:
      - "994"


    # ========================================================
    # Web 访问端口
    # ========================================================
    #
    # 格式：
    #
    #   宿主机端口:容器端口
    #
    # 当前：
    #
    #   18086:8080
    #
    # 容器内部固定监听 8080（上面 Dockerfile 的 ENV PORT），
    # 冒号右边那一位不要跟着改。
    #
    # 浏览器访问：
    #
    #   http://NAS-IP:18086
    #
    # 默认值 18086 避开 NAS 自带服务常用的 8080。
    # 要改就在同目录的 .env 里写 HOST_PORT，或者命令行传：
    #
    #   HOST_PORT=5666 docker compose up -d --build
    #
    # ./deploy.sh --port 5666 走的也是同一个变量。
    #
    ports:
      - "${HOST_PORT:-18086}:8080"


    # ========================================================
    # 环境变量
    # ========================================================
    environment:

      # ------------------------------------------------------
      # 时区
      #
      # 中国大陆：
      # Asia/Shanghai
      #
      # 如果在其他地区，可以修改。
      # ------------------------------------------------------
      TZ: Asia/Shanghai


      # ------------------------------------------------------
      # NASphere 登录用户名
      # ------------------------------------------------------
      NAV_USER: admin


      # ------------------------------------------------------
      # NASphere 登录密码
      #
      # 这里不写死明文密码：值从同目录的 .env（或 shell 环境）
      # 注入。./deploy.sh 首次安装会自动随机生成一个写进 .env，
      # 手工 compose 就先 cp .env.example .env 自己填一个。
      #
      # 只在 data/auth.json 不存在时用于初始化。
      # ------------------------------------------------------
      NAV_PASSWORD: ${NAV_PASSWORD:-}


      # ------------------------------------------------------
      # 登录 Session 有效期
      #
      # 单位：天
      # ------------------------------------------------------
      SESSION_DAYS: "30"


      # ------------------------------------------------------
      # 单次请求最大数据量
      #
      # 单位：Byte
      #
      # 8388608 = 8 MB
      # ------------------------------------------------------
      MAX_BODY: "8388608"


      # ------------------------------------------------------
      # Docker API 地址
      #
      # NASphere 通过 Docker Socket 与宿主机 Docker
      # 通信。
      # ------------------------------------------------------
      DOCKER_HOST: unix:///var/run/docker.sock


    # ========================================================
    # 数据卷
    # ========================================================
    volumes:

      # ------------------------------------------------------
      # NASphere 数据持久化
      #
      # 宿主机：
      #
      #   ./data
      #
      # 容器：
      #
      #   /data
      #
      # 删除容器不会删除这里的数据。
      # ------------------------------------------------------
      - ./data:/data


      # ------------------------------------------------------
      # Docker Socket
      #
      # 用于读取 Docker 项目、容器和运行状态。
      #
      # ⚠️ Docker Socket 属于高权限接口。
      # 不建议把 NASphere 直接暴露到公网。
      # ------------------------------------------------------
      - /var/run/docker.sock:/var/run/docker.sock


    # ========================================================
    # 拉取策略
    # ========================================================
    #
    # 强制使用本地构建。
    #
    # 不主动拉取：
    #
    #   nasphere:latest
    #
    # 避免 Compose 因为不存在远程 NASphere 镜像而
    # 尝试连接 Docker Hub。
    #
    pull_policy: build


# ============================================================
# 部署完成
# ============================================================
#
# 启动：
#
#   docker compose up -d --build
#
# 查看状态：
#
#   docker ps -a --filter name=nasphere
#
# 查看日志：
#
#   docker logs -f nasphere
#
# 停止：
#
#   docker compose down
#
# 更新 NASphere：
#
#   docker compose build --no-cache
#   docker compose up -d
#
# ============================================================
#
# NASphere
# https://github.com/peekaboo789/NASphere
#
# Author: peekaboo789
