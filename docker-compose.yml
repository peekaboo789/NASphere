services:
  nav:
    # 在 NAS 上有本项目源码时直接构建；用 make-image.sh 导出的离线镜像包时起好了 tar 再 up（不加 --build 就用现成镜像，这一行不会触发构建）
    build: .
    image: ${IMAGE:-local/nasphere}:${TAG:-latest}
    container_name: ${CONTAINER:-nasphere}
    restart: unless-stopped
    # node 是 PID 1，交给 init 收尸并转发信号
    init: true
    ports:
      # HOST_PORT 只影响宿主机这一侧，容器内固定监听 8080
      - "${HOST_PORT:-8080}:8080"
    environment:
      # 仅首次启动（data/auth.json 不存在时）用于初始化账号与密码；之后以 auth.json 为准
      NAV_USER: ${NAV_USER:-admin}
      NAV_PASSWORD: ${NAV_PASSWORD:-admin123}
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      # 上传图标与壁纸的请求体上限（字节）
      MAX_BODY: "${MAX_BODY:-8388608}"
      TZ: ${TZ:-Asia/Shanghai}
      # 跟着下面那行套接字的挂载路径走，改了 DOCKER_SOCK 这里也一致
      DOCKER_HOST: "unix://${DOCKER_SOCK:-/var/run/docker.sock}"
    volumes:
      # 备份 / 迁移只拷这一个目录：config.json、auth.json、.secret、uploads/ 都在里面
      - ${DATA_DIR:-./data}:/data
      # 主页的 Docker 窗口靠这个套接字读实时占用、启停容器。
      # 不要 Docker 窗口就注释掉下面这行：组件会显示「Docker 不可用」，其余功能不受影响。
      # 注意：能读写 docker.sock 就等于能拿下宿主机 root，所以只把主页账号给可信的人。
      - ${DOCKER_SOCK:-/var/run/docker.sock}:${DOCKER_SOCK:-/var/run/docker.sock}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 15s
    # 若想用非 root 运行：先执行 chown -R 1000:1000 ./data，再放开下一行
    # user: "1000:1000"
