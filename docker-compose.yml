# ============================================================
# NASphere - Docker Compose
# ============================================================
#
# 项目名称：NASphere
# 作者：peekaboo789
# GitHub：https://github.com/peekaboo789/NASphere
# 镜像：https://ghcr.io/peekaboo789/nasphere
#
# compose 只负责起容器：镜像是公开发布在 ghcr 上的，本机不需要源码、
# 不需要 Dockerfile，能上网就直接
#
#   docker compose up -d
#
# （镜像本地没有时 compose 会自己拉）。
#
# NAS 拉不动 ghcr 的话，用离线镜像包 docker load 之后再补一个同名的标签：
#
#   docker load -i nasphere-1.0.1-linux-amd64.tar.gz
#   docker tag local/nasphere:1.0.1 ghcr.io/peekaboo789/nasphere:1.0.1
#
# 默认访问：
#
#   http://NAS-IP:18086
#
# 升级：改下面 image 的标签；仓库里同一个标签的镜像内容变了就先
# docker compose pull 再 docker compose up -d。
#
# 这份文件是手工路线的样板。跑 ./deploy.sh 的话不用管它——脚本会按你给的
# 端口和数据目录另外生成一份 docker-compose.yml（写在安装目录里），会盖掉这一份，
# 所以别把要长期保留的改动只写在这里。
#
# ============================================================

services:

  # ----------------------------------------------------------
  # NASphere 主服务
  # ----------------------------------------------------------
  #
  # 故意不写 container_name：容器名由 compose 按「项目名-服务名-序号」自动生成，
  # 同一台机器上多装几套（换端口测试）不会撞名。要按名字找容器就加回
  # container_name: nasphere 那一行。
  #
  nasphere:

    # ========================================================
    # 镜像
    # ========================================================
    #
    # 发布在 GitHub Container Registry，标签跟 package.json 的 version 走。
    # 目前是 linux/amd64 单架构；ARM 机型（群晖多数是 arm64/v8）
    # 直接用这条会报 no matching manifest，改走离线包那条。
    #
    image: ghcr.io/peekaboo789/nasphere:1.0.1

    # ========================================================
    # 自动重启
    # ========================================================
    #
    # NAS / Docker 重启后自动启动 NASphere。
    #
    restart: unless-stopped

    # ========================================================
    # Web 访问端口
    # ========================================================
    #
    # 格式：宿主机端口:容器端口
    #
    # 容器内部固定监听 18086（镜像里 ENV PORT=18086），
    # 冒号右边那一位不要跟着改。
    #
    ports:
      - "18086:18086"

    # ========================================================
    # 数据卷
    # ========================================================
    volumes:

      # ------------------------------------------------------
      # NASphere 数据持久化
      #
      # 配置、账号、壁纸、图标都在这里，
      # 删除容器不会删除这里的数据。
      #
      # 宿主机 ./data 对应容器内 /app/data（镜像里 ENV DATA_DIR）。
      # ------------------------------------------------------
      - ./data:/app/data

      # ------------------------------------------------------
      # Docker Socket
      #
      # 容器组件用它读取 Docker 项目和容器信息，并做启停 / 重启。
      #
      # ⚠️ 属于高权限接口，不建议把 NASphere 直接暴露到公网。
      # ------------------------------------------------------
      - /var/run/docker.sock:/var/run/docker.sock

      # ------------------------------------------------------
      # 逐卷用量（可选）
      #
      # 「NAS 资源」读数卡默认只看得见 /app/data 这一卷
      # （页面上叫「数据盘」）。想让主页单独列出宿主机上的
      # 某个卷，就把那一卷挂进容器里的 /host 下面：
      #
      #   - /volume2:/host/volume2:ro
      #
      # /host 下面多一个目录，页面就多一栏，同一个文件系统
      # 挂两处只报一次；删掉这一行，那张卡自己变成
      # 「查不到这个卷」，data/config.json 不用动。
      #
      # ⚠️ 边界说清楚：只读挂载挡的是写，不是读。挂进来的
      # 那一卷，容器进程技术上就能读它的内容了，哪怕页面
      # 只显示容量数字。不需要逐卷用量就别加这一行。
      # ------------------------------------------------------
      # - /volume1:/host/volume1:ro
      # - /volume2:/host/volume2:ro

    # ========================================================
    # 时区
    # ========================================================
    #
    # 只影响容器内的时间显示（日志、天气的当天分界）。
    # 中国大陆是 Asia/Shanghai。
    #
    environment:
      TZ: Asia/Shanghai

# ============================================================
# 常用命令
# ============================================================
#
# 看容器（不写 container_name，所以容器名是 <项目名>-nasphere-1；
# 项目名默认就是这个文件所在的目录名）：
#
#   docker compose ps
#
# 看日志：
#
#   docker compose logs -f
#
# 停止：
#
#   docker compose down
#
# 注意：跟 ./deploy.sh 二选一。两边都占 18086，后起的那个会报
# port is already allocated；换路线前先把另一边 docker compose down 掉
# （脚本装的那份在它的安装目录里，cd 进去再 down）。
#
